<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1f17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Territory</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>Territory</h1>
        </div>
        <p id="statusText" class="status">Spreman</p>
      </header>

      <main id="map" class="map" role="application" aria-label="Interaktivna mapa teritorija"></main>

      <aside class="hud" aria-label="Kontrole igre">
        <div class="hud-row">
          <button id="btnTrack" type="button" class="btn btn-primary">Start GPS</button>
          <button id="btnDemo" type="button" class="btn">Demo hod</button>
          <button id="btnOpponent" type="button" class="btn btn-danger">Simuliraj rez</button>
        </div>
        <div class="hud-row meta">
          <span id="trailInfo">Trag: 0 točaka</span>
          <span id="areaInfo">Teritorij: 0 m²</span>
        </div>
        <p class="hint">
          Hodaj da crtaš trag. Zatvori petlju ili spoji se na svoj teritorij da osvojiš prostor.
          Ako te protivnik presiječe prije zatvaranja — gubiš teritorij.
        </p>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
